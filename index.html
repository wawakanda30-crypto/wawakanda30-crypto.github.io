<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>体重记录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:#f4f5f7;color:#333;padding:16px;padding-bottom:40px}
.top-title{text-align:center;font-size:20px;font-weight:600;margin-bottom:18px}
.input-wrap{display:flex;gap:12px;margin-bottom:16px}
#weightInput{flex:1;padding:14px 16px;border:1px solid #ddd;border-radius:12px;font-size:17px}
#saveBtn{padding:14px 22px;background:#e63946;color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:600}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #0000000c}
.goal-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.goal-icon{width:44px;height:44px;border-radius:50%;background:#fee;padding:10px;display:grid;place-items:center;color:#e63946;font-size:20px}
.goal-text h3{font-size:18px;margin-bottom:4px}
.goal-text p{color:#777;font-size:14px}
.progress-wrap{display:flex;align-items:center;gap:20px;margin-top:10px}
.circle{width:140px;height:140px;position:relative}
.circle svg{width:100%;height:100%;transform:rotate(-90deg)}
.circle .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.circle .num strong{font-size:32px}
.circle .num span{color:#888;font-size:16px}
.progress-info{flex:1}
.progress-info h4{font-size:20px;margin-bottom:6px}
.progress-info p{color:#555;line-height:1.5}
.edit-goal{color:#e63946;text-align:center;margin-top:8px;font-size:15px}
/* 图表容器：标题固定，滚动区域单独一层 */
.chart-title{display:flex;align-items:center;gap:6px;font-size:17px;font-weight:600;margin-bottom:10px}
.chart-outer{position:relative;overflow:hidden}
.chart-y-fixed{position:absolute;left:0;top:0;bottom:0;width:52px;z-index:2;background:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:4px 2px}
.chart-scroll{overflow-x:auto;overflow-y:hidden;margin-left:52px}
.chart-inner{min-width:600px;height:260px;position:relative}
.chart-grid{width:100%;height:100%}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat-item{padding:10px}
.stat-item strong{font-size:26px;display:block;margin-bottom:4px}
.stat-item span{color:#777;font-size:14px}
.history-title{font-size:18px;font-weight:600;margin-bottom:10px}
.history-item{padding:10px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="top-title">体重记录</div>
<div class="input-wrap">
<input id="weightInput" type="number" step="0.1" placeholder="输入体重 (kg)">
<button id="saveBtn">保存</button>
</div>

<div class="card">
<div class="goal-row">
<div class="goal-icon">🎯</div>
<div class="goal-text">
<h3>目标体重</h3>
<p>点击可修改目标值</p>
</div>
</div>
<div class="progress-wrap">
<div class="circle">
<svg viewBox="0 0 100 100">
<circle cx="50" cy="50" r="44" fill="none" stroke="#f0f0f0" stroke-width="7"/>
<circle id="progressArc" cx="50" cy="50" r="44" fill="none" stroke="#e63946" stroke-width="7" stroke-linecap="round"/>
</svg>
<div class="num"><strong id="currentShow">78.0</strong><span>/ <span id="targetShow">70</span> kg</span></div>
</div>
<div class="progress-info">
<h4>减重进度</h4>
<p id="progressText">距目标还差 8.0 kg，已完成 0%</p>
</div>
</div>
<div class="edit-goal" id="editGoal">修改目标</div>
</div>

<div class="card">
<div class="chart-title">📈 体重 (kg)</div>
<div class="chart-outer">
<div class="chart-y-fixed" id="yAxisBox"></div>
<div class="chart-scroll">
<div class="chart-inner" id="chartBox"></div>
</div>
</div>
</div>

<div class="card stat-grid">
<div class="stat-item"><strong id="latest">78.0 kg</strong><span>最新数值</span></div>
<div class="stat-item"><strong id="count">1 次</strong><span>记录次数</span></div>
<div class="stat-item"><strong id="maxVal">78.0 kg</strong><span>最高数值</span></div>
<div class="stat-item"><strong id="minVal">78.0 kg</strong><span>最低数值</span></div>
</div>

<div class="card">
<div class="history-title">历史记录</div>
<div id="historyList"></div>
</div>

<script>
const STORAGE_KEY = "weightRecordList";
const TARGET_KEY = "weightTarget";
let list = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
let target = Number(localStorage.getItem(TARGET_KEY) || 70);

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const weightInput = $("#weightInput");
const saveBtn = $("#saveBtn");
const chartBox = $("#chartBox");
const yAxisBox = $("#yAxisBox");
const historyList = $("#historyList");
const progressArc = $("#progressArc");
const currentShow = $("#currentShow");
const targetShow = $("#targetShow");
const progressText = $("#progressText");
const editGoal = $("#editGoal");
const latest = $("#latest");
const count = $("#count");
const maxVal = $("#maxVal");
const minVal = $("#minVal");

function saveList(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}
function saveTarget(v){
  target = v;
  localStorage.setItem(TARGET_KEY, v);
}
function addRecord(w){
  const now = new Date();
  list.push({
    weight: Number(w),
    time: now.toISOString()
  });
  list.sort((a,b)=>new Date(a.time)-new Date(b.time));
  saveList();
  renderAll();
}
function renderAll(){
  renderSummary();
  renderChart();
  renderHistory();
}
function renderSummary(){
  targetShow.textContent = target;
  if(!list.length){
    currentShow.textContent = "--";
    latest.textContent = "--";
    count.textContent = "0 次";
    maxVal.textContent = "--";
    minVal.textContent = "--";
    progressText.textContent = "暂无记录";
    progressArc.style.strokeDasharray = "0 276.46";
    return;
  }
  const last = list[list.length-1];
  const curr = last.weight;
  currentShow.textContent = curr.toFixed(1);
  latest.textContent = curr.toFixed(1)+" kg";
  count.textContent = list.length+" 次";
  const ws = list.map(x=>x.weight);
  const max = Math.max(...ws);
  const min = Math.min(...ws);
  maxVal.textContent = max.toFixed(1)+" kg";
  minVal.textContent = min.toFixed(1)+" kg";
  const diff = curr - target;
  const totalNeed = max - target;
  let pct = 0;
  if(totalNeed>0) pct = Math.max(0, Math.min(100, ((max - curr)/totalNeed)*100));
  progressText.textContent = `距目标还差 ${diff.toFixed(1)} kg，已完成 ${pct.toFixed(0)}%`;
  const circum = 2 * Math.PI * 44;
  const dash = circum * pct / 100;
  progressArc.style.strokeDasharray = `${dash} ${circum - dash}`;
}
function renderChart(){
  chartBox.innerHTML = "";
  yAxisBox.innerHTML = "";
  if(list.length < 1) return;
  const ws = list.map(x=>x.weight);
  const minW = Math.floor(Math.min(...ws)-1);
  const maxW = Math.ceil(Math.max(...ws)+1);
  const range = maxW - minW;
  const h = 260;
  const wPerItem = 70;
  const width = list.length * wPerItem;
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("width",width);
  svg.setAttribute("height",h);
  svg.setAttribute("viewBox",`0 0 ${width} ${h}`);
  // 网格线
  const step = range>0 ? range/5 : 1;
  for(let i=0;i<=5;i++){
    const val = maxW - step*i;
    const y = (val - minW)/range * h;
    const line = document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1",0);
    line.setAttribute("y1",y);
    line.setAttribute("x2",width);
    line.setAttribute("y2",y);
    line.setAttribute("stroke","#ddd");
    line.setAttribute("stroke-width","1");
    svg.appendChild(line);
    // Y轴固定文字
    const txt = document.createElement("div");
    txt.style.fontSize="12px";
    txt.style.color="#666";
    txt.style.textAlign="right";
    txt.style.height="0px";
    txt.style.position="absolute";
    txt.style.top=(y-8)+"px";
    txt.textContent = val.toFixed(1);
    yAxisBox.appendChild(txt);
  }
  // 折线
  let pathD = "";
  const pointList = [];
  list.forEach((item,idx)=>{
    const x = idx * wPerItem + wPerItem/2;
    const y = h - ((item.weight - minW)/range * h);
    pointList.push({x,y,w:item.weight,t:new Date(item.time)});
    if(idx===0) pathD += `M ${x} ${y}`;
    else pathD += ` L ${x} ${y}`;
  });
  const path = document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d",pathD);
  path.setAttribute("fill","rgba(230,57,70,0.12)");
  path.setAttribute("stroke","#e63946");
  path.setAttribute("stroke-width","2.5");
  svg.appendChild(path);
  // 圆点+日期
  pointList.forEach(p=>{
    const c = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",p.x);
    c.setAttribute("cy",p.y);
    c.setAttribute("r","5");
    c.setAttribute("fill","#fff");
    c.setAttribute("stroke","#e63946");
    c.setAttribute("stroke-width","2.2");
    svg.appendChild(c);
    const t = document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x",p.x);
    t.setAttribute("y",h-4);
    t.setAttribute("text-anchor","middle");
    t.setAttribute("font-size","12");
    t.setAttribute("fill","#666");
    t.textContent = `${p.t.getMonth()+1}月${p.t.getDate()}日`;
    svg.appendChild(t);
  });
  chartBox.appendChild(svg);
}
function renderHistory(){
  historyList.innerHTML = "";
  [...list].reverse().forEach((item,idx)=>{
    const d = new Date(item.time);
    const timeStr = `${d.getMonth()+1}-${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
    const div = document.createElement("div");
    div.className = "history-item";
    div.innerHTML = `<span>${item.weight} kg</span><span style="color:#777">${timeStr}</span>`;
    historyList.appendChild(div);
  })
}
saveBtn.onclick = ()=>{
  const v = Number(weightInput.value);
  if(isNaN(v) || v<30 || v>300) return alert("请输入合理体重");
  addRecord(v);
  weightInput.value = "";
}
editGoal.onclick = ()=>{
  const n = prompt("设置目标体重(kg)", target);
  if(n===null) return;
  const num = Number(n);
  if(isNaN(num) || num<30 || num>300) return alert("数值不对");
  saveTarget(num);
  renderAll();
}
renderAll();
</script>
</body>
</html>
